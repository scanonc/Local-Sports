<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Sports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Local Sports</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/matches/">Matches</a>
                <a class="nav-link" href="/matches/create/">Create match</a>
                {% if user.is_authenticated %}
                <form method="post" action="/users/logout/" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-link nav-link d-inline align-baseline p-0" type="submit">Logout</button>
                </form>
                {% else %}
                <a class="nav-link" href="/users/login/">Login</a>
                <a class="nav-link" href="/users/signup/">Sign up</a>
                {% endif %}
                <a class="nav-link" href="/admin/">Admin</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% if messages %}
        {% for message in messages %}
        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %}" role="alert">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
