{% comment %}FR20 - Result row for the Match Info list on the match detail page.{% endcomment %}
{% if match.has_result %}
<dt>Result</dt>
<dd><span class="badge bg-success">{{ match.get_result_display }}</span></dd>
{% elif match.awaiting_result %}
<dt>Result</dt>
<dd><span class="badge bg-warning text-dark">Pending</span></dd>
{% endif %}
